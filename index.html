<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>أكاديمية التربية الخاصة | دار الفرسان</title>
<meta name="theme-color" content="#0f4c5c">
<style>html,body{margin:0;height:100%;font-family:Tahoma,Arial,sans-serif;background:#f4f7f7;color:#16262b}#l{height:100%;min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}#l i{width:38px;height:38px;border:4px solid #d5e3e6;border-top-color:#0f4c5c;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}button{padding:10px 22px;border:0;border-radius:9px;background:#0f4c5c;color:#fff;font-size:15px;cursor:pointer}</style></head>
<body><div id="l"><i></i><div>جارٍ فتح منصة أكاديمية التربية الخاصة…</div></div>
<script>
(function(){
  var U='https://script.google.com/macros/s/AKfycbxnqLsUdlohQiO3Q1g3hxSCuk4FFRHPwbJ07JS2DHEV5ofF4emUhZWD_-Hs0a_naI3m/exec?app=1';
  function show(t){document.open();document.write(t);document.close()}
  var c=null;try{c=localStorage.getItem('app_html')}catch(e){}
  if(c&&c.indexOf('<!DOCTYPE html>')===0){if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){show(c)});else show(c);return}
  function go(){
    fetch(U,{credentials:'omit'}).then(function(r){return r.text()}).then(function(t){
      if(t.indexOf('<!DOCTYPE html>')!==0)throw 0;
      try{localStorage.setItem('app_html',t)}catch(e){}
      show(t);
    }).catch(function(){
      var l=document.getElementById('l');l.textContent='';
      var d=document.createElement('div');d.textContent='تعذر الاتصال بالمنصة. تحقق من الإنترنت.';
      var b=document.createElement('button');b.textContent='إعادة المحاولة';b.onclick=function(){location.reload()};
      l.appendChild(d);l.appendChild(b);
    });
  }
  go();
})();
</script></body></html>
